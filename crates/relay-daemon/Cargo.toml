[package]
name = "relay-daemon"
version = "0.1.27"
edition = "2021"
description = "Local daemon, CLI and MCP bridge for Agent Relay"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
relay-sys = { path = "../relay-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
relay-protocol = { path = "../relay-protocol" }
rustix = { version = "1", features = ["process"] }
relay-core = { path = "../relay-core" }
relay-store = { path = "../relay-store" }
relay-git = { path = "../relay-git" }
fs2 = "0.4"
sha2 = "0.11"

rusqlite = { version = "0.43", features = ["bundled"] }

[[bin]]
name = "relayctl"
path = "src/bin/relayctl.rs"
