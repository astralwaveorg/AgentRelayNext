name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Full Rust checks
        run: ./scripts/check full
      - name: Cross-build arm64 relayctl
        run: cargo build --release --locked --offline --target aarch64-apple-darwin -p relay-daemon --bin relayctl
      - name: Compile SwiftUI app
        env:
          RELAY_MACOS_TARGET: arm64-apple-macosx13.0
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/relay-daemon/Cargo.toml)"
          packaging/build-app.sh "$RUNNER_TEMP/RelayTaskWindow.app" "$version" ci
