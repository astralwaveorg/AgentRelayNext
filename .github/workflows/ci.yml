name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Full Rust checks
        run: ./scripts/check full
      - name: Compile SwiftUI app
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/relay-daemon/Cargo.toml)"
          packaging/build-app.sh "$RUNNER_TEMP/RelayTaskWindow.app" "$version" ci
