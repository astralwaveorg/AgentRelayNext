<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Agent Relay workflow</title>
  <desc id="desc">Implementation, local verification, independent read-only review, and human acceptance.</desc>
  <rect width="1200" height="420" rx="24" fill="#f7f9fd"/>
  <text x="58" y="58" fill="#15233b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" letter-spacing="3">WORKFLOW</text>
  <text x="58" y="102" fill="#15233b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700">Implementation → verification → independent review</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <g transform="translate(58,150)">
      <rect width="250" height="180" rx="18" fill="#ffffff" stroke="#dfe7f4"/>
      <circle cx="28" cy="30" r="12" fill="#2a7fff"/>
      <text x="52" y="36" fill="#15233b" font-size="18" font-weight="700">1 · Implement</text>
      <text x="24" y="78" fill="#536582" font-size="16">Claude Code writes</text>
      <text x="24" y="104" fill="#536582" font-size="16">inside an isolated</text>
      <text x="24" y="130" fill="#536582" font-size="16">Git worktree.</text>
      <text x="24" y="158" fill="#8b9ab2" font-size="13">main checkout stays clean</text>
    </g>
    <g transform="translate(350,150)">
      <rect width="250" height="180" rx="18" fill="#ffffff" stroke="#dfe7f4"/>
      <circle cx="28" cy="30" r="12" fill="#0aa77a"/>
      <text x="52" y="36" fill="#15233b" font-size="18" font-weight="700">2 · Verify</text>
      <text x="24" y="78" fill="#536582" font-size="16">Fixed local command,</text>
      <text x="24" y="104" fill="#536582" font-size="16">no shell, bounded</text>
      <text x="24" y="130" fill="#536582" font-size="16">output and timeout.</text>
      <text x="24" y="158" fill="#8b9ab2" font-size="13">byte-bound test receipt</text>
    </g>
    <g transform="translate(642,150)">
      <rect width="250" height="180" rx="18" fill="#ffffff" stroke="#dfe7f4"/>
      <circle cx="28" cy="30" r="12" fill="#6b5cff"/>
      <text x="52" y="36" fill="#15233b" font-size="18" font-weight="700">3 · Review</text>
      <text x="24" y="78" fill="#536582" font-size="16">A different tool and</text>
      <text x="24" y="104" fill="#536582" font-size="16">model review only the</text>
      <text x="24" y="130" fill="#536582" font-size="16">patch, status, digests.</text>
      <text x="24" y="158" fill="#8b9ab2" font-size="13">no workspace write access</text>
    </g>
    <g transform="translate(934,150)">
      <rect width="208" height="180" rx="18" fill="#15233b"/>
      <circle cx="28" cy="30" r="12" fill="#79e8ff"/>
      <text x="52" y="36" fill="#ffffff" font-size="18" font-weight="700">You accept</text>
      <text x="24" y="78" fill="#b9c9e5" font-size="16">Patch + receipt +</text>
      <text x="24" y="104" fill="#b9c9e5" font-size="16">review report.</text>
      <text x="24" y="130" fill="#b9c9e5" font-size="16">Nothing auto-merges.</text>
      <text x="24" y="158" fill="#79e8ff" font-size="13">evidence stays local</text>
    </g>
  </g>
  <g stroke="#9bb0d1" stroke-width="2" stroke-linecap="round">
    <path d="M308 240 H342"/><path d="M600 240 H634"/><path d="M892 240 H926"/>
  </g>
</svg>
